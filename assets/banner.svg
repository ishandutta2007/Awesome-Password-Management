<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes scan {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(100px); opacity: 0; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      .pulsing-bg { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
      .floating-shield { animation: float 4s ease-in-out infinite; transform-origin: center; }
      .scanning-line { animation: scan 3s ease-in-out infinite; }
      .flowing-line { stroke-dasharray: 10, 10; animation: dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Animated background glow shapes -->
  <circle cx="200" cy="100" r="180" fill="#6366f1" opacity="0.15" class="pulsing-bg" />
  <circle cx="1000" cy="300" r="220" fill="#ec4899" opacity="0.12" class="pulsing-bg" />
  <circle cx="600" cy="200" r="150" fill="#8b5cf6" opacity="0.1" class="pulsing-bg" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Decorative Circuit / Security Flow Lines -->
  <path d="M 150 200 L 300 200 L 350 150 L 450 150" stroke="url(#accent-grad)" stroke-width="2" fill="none" class="flowing-line" opacity="0.6" />
  <path d="M 1050 200 L 900 200 L 850 250 L 750 250" stroke="url(#accent-grad)" stroke-width="2" fill="none" class="flowing-line" opacity="0.6" />

  <!-- Left Shield Icon (Floating & Glowing) -->
  <g transform="translate(180, 120)" class="floating-shield" filter="url(#glow)">
    <path d="M 80 10 L 140 40 V 90 C 140 135 80 165 80 165 C 80 165 20 135 20 90 V 40 L 80 10 Z" fill="url(#shield-grad)" opacity="0.9"/>
    <!-- Lock inside Shield -->
    <rect x="62" y="80" width="36" height="30" rx="4" fill="#ffffff" />
    <path d="M 70 80 V 68 C 70 60 76 54 80 54 C 84 54 90 60 90 68 V 80" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="80" cy="93" r="3" fill="#1e1b4b" />
    <path d="M 80 96 V 102" stroke="#1e1b4b" stroke-width="2" />
  </g>

  <!-- Central Content -->
  <g transform="translate(400, 130)">
    <!-- Badge / Subtitle -->
    <rect x="0" y="0" width="340" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="170" y="21" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">
      🔑 CURATED ECOSYSTEM &amp; VAULTS
    </text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Password
    </text>
    <text x="0" y="135" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Management 🛡️
    </text>

    <!-- Description -->
    <text x="0" y="175" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      SaaS Platforms, Open-Source Vaults, Passkeys &amp; Secrets Management
    </text>
  </g>
</svg>
